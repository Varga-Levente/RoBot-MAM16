<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoBot Control</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>

<div class="app-container" id="app-container">

  <!-- ── Fő terület (videó + overlay panelek) ──────────────────────────── -->
  <div class="main-area" id="main-area">

    <!-- Videóstream -->
    <video id="video" autoplay muted playsinline></video>

    <!-- Stream nincs overlay -->
    <div class="no-video" id="no-video">
      <div class="no-video-icon">📡</div>
      <div class="no-video-text">Stream csatlakoztatása...</div>
    </div>

    <!-- Felső sáv: szerep badge + kapu kód -->
    <div class="top-bar glass">
      <span class="role-badge" id="role-badge">PAC-MAN</span>
      <div class="gate-panel">
        <span class="label">Kapukód</span>
        <span class="code" id="gate-code">---</span>
      </div>
    </div>

    <!-- Alsó sáv: IR + LoRa + WebRTC -->
    <div class="bottom-bar glass">
      <div class="ir-panel">
        <span class="label">IR</span>
        <span class="ir-code" id="ir-code">---</span>
        <div class="ir-dot" id="ir-dot"></div>
      </div>
      <div class="bar-sep"></div>
      <div class="conn-panel">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-text">LoRa...</span>
      </div>
      <div class="bar-sep"></div>
      <div class="conn-panel">
        <div class="conn-dot" id="webrtc-dot"></div>
        <span id="webrtc-text">Stream...</span>
      </div>
    </div>

    <!-- Debug panel (jobb alsó overlay) -->
    <div class="debug-container" id="debug-container">
      <div class="debug-header" onclick="toggleDebug()">
        <span class="log-title">Debug</span>
        <button class="toggle-btn" id="debug-toggle-btn">▲</button>
      </div>
      <div class="debug-body" id="debug-body">
        <!-- Vision szekció -->
        <div class="debug-section">
          <div class="debug-row">
            <span class="debug-label">Vision</span>
            <span class="debug-value" id="dbg-vision-state">WAIT_FOR_F</span>
          </div>
          <div class="debug-row">
            <span class="debug-label">Digit</span>
            <span class="debug-value" id="dbg-digit">---</span>
          </div>
          <div class="debug-row">
            <span class="debug-label">Annotálás</span>
            <button class="annot-btn" id="annot-btn" onclick="toggleAnnotation()">KI</button>
          </div>
        </div>
        <div class="debug-divider"></div>
        <!-- IR szekció -->
        <div class="debug-section">
          <div class="debug-row">
            <span class="debug-label">IR utolsó</span>
            <span class="debug-value" id="dbg-ir-code">---</span>
          </div>
          <div class="debug-row">
            <span class="debug-label">IR szám</span>
            <span class="debug-value" id="dbg-ir-count">0</span>
          </div>
        </div>
        <div class="debug-divider"></div>
        <!-- Motor sebességek -->
        <div class="debug-section">
          <div class="debug-row">
            <span class="debug-label">FL</span>
            <div class="speed-bar-wrap"><div class="speed-bar" id="dbg-spd-0"></div></div>
            <span class="speed-val" id="dbg-val-0">0.00</span>
          </div>
          <div class="debug-row">
            <span class="debug-label">FR</span>
            <div class="speed-bar-wrap"><div class="speed-bar" id="dbg-spd-1"></div></div>
            <span class="speed-val" id="dbg-val-1">0.00</span>
          </div>
          <div class="debug-row">
            <span class="debug-label">RL</span>
            <div class="speed-bar-wrap"><div class="speed-bar" id="dbg-spd-2"></div></div>
            <span class="speed-val" id="dbg-val-2">0.00</span>
          </div>
          <div class="debug-row">
            <span class="debug-label">RR</span>
            <div class="speed-bar-wrap"><div class="speed-bar" id="dbg-spd-3"></div></div>
            <span class="speed-val" id="dbg-val-3">0.00</span>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /main-area -->

  <!-- ── Log drawer (jobb oldali kihúzható panel) ───────────────────────── -->
  <div class="log-drawer" id="log-drawer">
    <div class="log-drawer-header">
      <div>
        <span class="log-title">Napló</span>
        <span class="log-count" id="log-count">0 sor</span>
      </div>
      <button class="toggle-btn" onclick="toggleLog()" title="Bezárás">✕</button>
    </div>
    <div class="log-filters">
      <button class="lvl-btn active" data-level="DEBUG"    onclick="toggleFilter('DEBUG')">DEBUG</button>
      <button class="lvl-btn active" data-level="INFO"     onclick="toggleFilter('INFO')">INFO</button>
      <button class="lvl-btn active" data-level="WARNING"  onclick="toggleFilter('WARNING')">WARN</button>
      <button class="lvl-btn active" data-level="ERROR"    onclick="toggleFilter('ERROR')">ERROR</button>
      <button class="lvl-btn active" data-level="CRITICAL" onclick="toggleFilter('CRITICAL')">CRIT</button>
    </div>
    <div class="log-body" id="log-body"></div>
  </div>

</div><!-- /app-container -->

<!-- Log megnyitó gomb (jobb szélen, függőleges) -->
<button class="log-trigger" id="log-trigger" onclick="toggleLog()">Napló</button>

<script src="/web/app.js"></script>
</body>
</html>
