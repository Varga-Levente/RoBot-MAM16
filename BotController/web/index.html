<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoBot BotController</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>

<h1>RoBot BotController</h1>
<p class="subtitle">Raspberry Pi 3B+ · Xbox One USB · E22-900T22D-V2 LoRa</p>

<!-- Status badges -->
<div class="status-bar">
  <div class="badge"><div class="dot" id="dot-gamepad"></div><span id="lbl-gamepad">Gamepad: –</span></div>
  <div class="badge"><div class="dot" id="dot-lora"></div><span id="lbl-lora">LoRa: –</span></div>
  <div class="badge" id="speed-badge">Sebesség: –%</div>
</div>

<div class="grid">

  <!-- Kontroller vizualizáció -->
  <div class="card">
    <h2>Kontroller állapot</h2>

    <!-- Triggerek + joystick egy sorban -->
    <div class="ctrl-visual">

      <!-- LT trigger (függőleges) -->
      <div class="trig-col">
        <div class="trig-track">
          <div class="trig-fill trig-lt" id="lt-fill"></div>
        </div>
        <div class="trig-footer">
          <span class="trig-name">LT</span>
          <span class="trig-pct" id="lt-pct">0%</span>
        </div>
      </div>

      <!-- Joystick 2D (közép) -->
      <div class="joy-col">
        <canvas class="joy" id="joy-canvas" width="88" height="88"></canvas>
        <div class="joy-vals">
          <div><span class="jv-lbl">Lin</span><span class="jv-val" id="val-linear">0.000</span></div>
          <div><span class="jv-lbl">Ang</span><span class="jv-val" id="val-angular">0.000</span></div>
          <div><span class="jv-lbl">Lat</span><span class="jv-val" id="val-lateral">0.000</span></div>
          <div><span class="jv-lbl">LY</span><span class="jv-val" id="val-lefty">0.000</span></div>
        </div>
      </div>

      <!-- RT trigger (függőleges) -->
      <div class="trig-col">
        <div class="trig-track">
          <div class="trig-fill trig-rt" id="rt-fill"></div>
        </div>
        <div class="trig-footer">
          <span class="trig-name">RT</span>
          <span class="trig-pct" id="rt-pct">0%</span>
        </div>
      </div>

    </div>

    <!-- Lateral (bal stick X) -->
    <div class="stick-row">
      <span class="stick-lbl">Lat</span>
      <div class="stick-track">
        <div class="stick-center-line"></div>
        <div class="stick-knob" id="stick-lat-knob"></div>
      </div>
      <span class="stick-val" id="val-stick-lat">0.000</span>
    </div>

    <!-- Left Y (bal stick Y) -->
    <div class="stick-row">
      <span class="stick-lbl">L.Y</span>
      <div class="stick-track">
        <div class="stick-center-line"></div>
        <div class="stick-knob stick-knob-ly" id="stick-ly-knob"></div>
      </div>
      <span class="stick-val" id="val-stick-ly">0.000</span>
    </div>

    <!-- Gombállapotok -->
    <div class="btn-states">
      <div class="bs bs-y" id="bs-y">Y</div>
      <div class="bs bs-a" id="bs-a">A</div>
      <div class="bs bs-x" id="bs-x">X</div>
      <div class="bs bs-b" id="bs-b">B</div>
    </div>
  </div>

  <!-- Vezérlés beállítások -->
  <div class="card">
    <h2>Vezérlés</h2>

    <div class="field">
      <label>Sebesség limit <span class="value-hint" id="hint-speed">100%</span></label>
      <input type="range" id="inp-speed" min="0" max="100" step="1" value="100"
             oninput="document.getElementById('hint-speed').textContent=this.value+'%'">
    </div>

    <div class="field">
      <label>Holtzona <span class="value-hint" id="hint-dz">5%</span></label>
      <input type="range" id="inp-dz" min="0" max="30" step="1" value="5"
             oninput="document.getElementById('hint-dz').textContent=this.value+'%'">
    </div>

    <div class="field">
      <label>Küldési sebesség</label>
      <select id="inp-hz">
        <option value="10">10 Hz</option>
        <option value="20" selected>20 Hz</option>
        <option value="50">50 Hz</option>
      </select>
    </div>

    <div class="field">
      <label>Gamepad eszköz (üres = auto)</label>
      <input type="text" id="inp-device" placeholder="/dev/input/event3">
    </div>

    <div class="btn-row">
      <button class="primary" onclick="saveSection('ctrl')">Mentés</button>
      <button onclick="loadSettings()">Visszaállítás</button>
    </div>
    <div class="save-status" id="status-ctrl"></div>
  </div>

  <!-- LoRa beállítások -->
  <div class="card">
    <h2>LoRa (E22-900T22D-V2)</h2>

    <div class="field">
      <label>UART port</label>
      <input type="text" id="inp-uart" placeholder="/dev/ttyAMA0">
    </div>

    <div class="field">
      <label>M0 pin (BCM)</label>
      <input type="number" id="inp-m0" min="0" max="40" value="20">
    </div>

    <div class="field">
      <label>M1 pin (BCM)</label>
      <input type="number" id="inp-m1" min="0" max="40" value="21">
    </div>

    <div class="field">
      <label>AUX pin (BCM)</label>
      <input type="number" id="inp-aux" min="0" max="40" value="16">
    </div>

    <div class="field">
      <label>Csatorna (0–80) <span class="value-hint" id="hint-ch">868.125 MHz</span></label>
      <input type="number" id="inp-ch" min="0" max="80" value="18"
             oninput="document.getElementById('hint-ch').textContent=(850.125+parseInt(this.value||0)).toFixed(3)+' MHz'">
    </div>

    <div class="field">
      <label>TX teljesítmény <span class="value-hint" id="hint-txpwr">22 dBm</span></label>
      <input type="range" id="inp-txpwr" min="0" max="22" step="1" value="22"
             oninput="document.getElementById('hint-txpwr').textContent=this.value+' dBm'">
    </div>

    <div class="btn-row">
      <button class="primary" onclick="saveSection('lora')">Mentés + Újrainicializálás</button>
      <button onclick="loadSettings()">Visszaállítás</button>
    </div>
    <div class="save-status" id="status-lora"></div>
  </div>

  <!-- Robot mozgás vizualizáció -->
  <div class="card">
    <h2>Robot mozgás</h2>
    <canvas id="robot-canvas" width="300" height="230"></canvas>
    <div class="jump-indicator" id="jump-indicator">–</div>
  </div>

</div>

<script src="/web/app.js"></script>
</body>
</html>
